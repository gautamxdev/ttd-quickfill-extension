name: Check extension
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Package extension
        run: zip -r ttd-quickfill-extension.zip manifest.json flows.js plan.js service-worker.js content.js panel.html panel.css panel.js icons README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ttd-quickfill-extension
          path: ttd-quickfill-extension.zip
